<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VideoVault Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #07090e; color: #f8fafc; font-family: system-ui, sans-serif; }
    .glass { background: rgba(19, 24, 38, 0.85); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="p-4 sm:p-8 max-w-5xl mx-auto space-y-6">

  <!-- Login Box -->
  <div id="loginBox" class="max-w-sm mx-auto mt-20 glass p-6 rounded-2xl space-y-4">
    <h1 class="text-xl font-bold text-center text-cyan-400">🔐 Admin Login</h1>
    <input id="adminPass" type="password" placeholder="Admin Password দিন" class="w-full px-4 py-2.5 rounded-xl bg-black/50 border border-white/10 text-sm"/>
    <button onclick="login()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 font-bold text-sm">Login</button>
  </div>

  <!-- Dashboard -->
  <div id="dash" class="hidden space-y-6">
    <header class="flex justify-between items-center">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">⚡ VideoVault Admin</h1>
      <button onclick="loadAll()" class="px-4 py-2 rounded-xl bg-white/10 text-xs font-bold">🔄 Refresh</button>
    </header>

    <!-- Stats -->
    <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
      <div class="glass p-4 rounded-2xl border-emerald-500/30">
        <div class="text-xs text-emerald-400 flex items-center gap-1.5 font-semibold">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> লাইভ অনলাইন
        </div>
        <div id="stLive" class="text-2xl font-bold text-emerald-400 mt-1">0</div>
      </div>
      <div class="glass p-4 rounded-2xl"><div class="text-xs text-gray-400">মোট ইউজার</div><div id="stUsers" class="text-2xl font-bold text-cyan-400 mt-1">0</div></div>
      <div class="glass p-4 rounded-2xl"><div class="text-xs text-gray-400">অ্যাক্টিভ (২৪ ঘণ্টা)</div><div id="stActive" class="text-2xl font-bold text-teal-400 mt-1">0</div></div>
      <div class="glass p-4 rounded-2xl"><div class="text-xs text-gray-400">মোট ভিডিও</div><div id="stVideos" class="text-2xl font-bold text-purple-400 mt-1">0</div></div>
      <div class="glass p-4 rounded-2xl"><div class="text-xs text-gray-400">আনলক (২৪ ঘণ্টা)</div><div id="stUnlocks" class="text-2xl font-bold text-amber-400 mt-1">0</div></div>
    </div>

    <!-- Broadcast -->
    <div class="glass p-5 rounded-2xl space-y-3">
      <h2 class="font-bold text-base text-pink-400">📢 ইউজার ব্রডকাস্ট (অটো-ডিলিট সাপোর্টেড)</h2>
      <input id="bcPhoto" placeholder="ছবির লিংক (ঐচ্ছিক)" class="w-full px-3 py-2 rounded-xl bg-black/40 border border-white/10 text-sm"/>
      <textarea id="bcText" rows="3" placeholder="ব্রডকাস্ট মেসেজ লিখুন (HTML সাপোর্টেড)..." class="w-full px-3 py-2 rounded-xl bg-black/40 border border-white/10 text-sm"></textarea>
      <button onclick="sendBroadcast()" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-pink-500 to-rose-600 font-bold text-sm">🚀 Send Broadcast</button>
    </div>

    <!-- Settings -->
    <div class="glass p-5 rounded-2xl space-y-4">
      <h2 class="font-bold text-base text-cyan-400">⚙️ বিজ্ঞাপন, চ্যানেল, নোটিশ ও অটো-ক্লিন সেটিংস</h2>
      <div class="grid sm:grid-cols-2 gap-3 text-sm">
        <div><label class="text-xs text-gray-400">App Name</label><input id="sAppName" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
        <div><label class="text-xs text-gray-400">Welcome Notice (মিনি অ্যাপের শুরুতে দেখাবে)</label><input id="sNotice" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
        <div><label class="text-xs text-gray-400">Monetag Zone ID (১টি ID-তেই অটো ভিডিও অ্যাড চলবে)</label><input id="sMonetag" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
        <div><label class="text-xs text-gray-400">Ad Timer (Seconds - সব জায়গায় অটো আপডেট হবে)</label><input id="sTimer" type="number" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
        <div><label class="text-xs text-gray-400">Unlock Expiry (Hours)</label><input id="sExpiry" type="number" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
        <div><label class="text-xs text-gray-400">VIP Price (Coins / 1 Day)</label><input id="sVipPrice" type="number" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
        <div><label class="text-xs text-gray-400">Bot Auto-Delete (Hours)</label><input id="sAutoDel" type="number" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
        <div><label class="text-xs text-gray-400">Notification Channel ID (-100...)</label><input id="sNotifCh" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
        <div><label class="text-xs text-gray-400">Watch Button Text</label><input id="sWatchTxt" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
        <div><label class="text-xs text-gray-400">Tutorial Button Text</label><input id="sTutTxt" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
        <div><label class="text-xs text-gray-400">Tutorial Video Link</label><input id="sTutUrl" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
        <div><label class="text-xs text-gray-400">Custom Channel Button Text (Notification)</label><input id="sCustTxt" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
        <div><label class="text-xs text-gray-400">Custom Channel Link (Notification)</label><input id="sCustUrl" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
        <div><label class="text-xs text-gray-400">Bot Start: Main Channel Name</label><input id="sMainName" placeholder="🔵 মেইন চ্যানেল" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
        <div><label class="text-xs text-gray-400">Bot Start: Main Channel Link</label><input id="sMainUrl" placeholder="https://t.me/..." class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
        <div><label class="text-xs text-gray-400">Bot Start: Request Channel Name</label><input id="sReqName" placeholder="🟡 রিকোয়েস্ট চ্যানেল" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
        <div><label class="text-xs text-gray-400">Bot Start: Request Channel Link</label><input id="sReqUrl" placeholder="https://t.me/..." class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10"/></div>
      </div>
      <div>
        <label class="text-xs text-gray-400">Direct Links (প্রতি লাইনে একটি করে আনলিমিটেড লিংক দিন - র‍্যান্ডমলি ওপেন হবে)</label>
        <textarea id="sDirectLinks" rows="3" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10 text-sm"></textarea>
      </div>
      <div>
        <label class="text-xs text-gray-400">Force Join Channel IDs (প্রতি লাইনে শুধু Channel ID বা @username দিন — বটকে চ্যানেলে Admin রাখবেন)</label>
        <textarea id="sForceCh" rows="3" placeholder="-1001234567890&#10;@mychannel" class="w-full mt-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10 text-sm font-mono"></textarea>
      </div>
      <button onclick="saveSettings()" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 text-black font-bold text-sm">💾 Save All Settings</button>
    </div>

    <!-- Videos List -->
    <div class="glass p-5 rounded-2xl space-y-3">
      <h2 class="font-bold text-base text-amber-400">🎬 ভিডিও ম্যানেজমেন্ট</h2>
      <div id="vidList" class="space-y-2"></div>
    </div>
  </div>

<script>
let PASS = "", statsTimer = null;
async function admApi(url, method="GET", body=null) {
  const opts = { method, headers: { "Content-Type": "application/json", "x-admin-pass": PASS } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error("Unauthorized or Error");
  return res.json();
}

async function login() {
  PASS = document.getElementById("adminPass").value;
  try {
    await loadAll();
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("dash").classList.remove("hidden");
    clearInterval(statsTimer);
    statsTimer = setInterval(refreshStatsOnly, 20000);
  } catch { alert("ভুল পাসওয়ার্ড!"); }
}

async function refreshStatsOnly() {
  try {
    const st = await admApi("/api/admin/stats");
    document.getElementById("stLive").innerText = st.live_online || 0;
    document.getElementById("stUsers").innerText = st.total_users;
    document.getElementById("stActive").innerText = st.active_24h;
    document.getElementById("stVideos").innerText = st.total_videos;
    document.getElementById("stUnlocks").innerText = st.unlocks_24h;
  } catch {}
}

async function loadAll() {
  await refreshStatsOnly();
  const s = await admApi("/api/admin/settings");
  document.getElementById("sAppName").value = s.app_name || "";
  document.getElementById("sNotice").value = s.welcome_notice || "";
  document.getElementById("sMonetag").value = s.monetag_zone_id || "";
  document.getElementById("sTimer").value = s.ad_timer || 15;
  document.getElementById("sExpiry").value = s.unlock_expiry_hours || 24;
  document.getElementById("sVipPrice").value = s.vip_coin_price || 50;
  document.getElementById("sAutoDel").value = s.auto_delete_hours || 6;
  document.getElementById("sNotifCh").value = s.notification_channel_id || "";
  document.getElementById("sWatchTxt").value = s.watch_btn_text || "";
  document.getElementById("sTutTxt").value = s.tutorial_btn_text || "";
  document.getElementById("sTutUrl").value = s.tutorial_btn_url || "";
  document.getElementById("sCustTxt").value = s.custom_btn_text || "";
  document.getElementById("sCustUrl").value = s.custom_btn_url || "";
  document.getElementById("sMainName").value = s.main_channel_name || "🔵 মেইন চ্যানেল";
  document.getElementById("sMainUrl").value = s.main_channel_url || "";
  document.getElementById("sReqName").value = s.request_channel_name || "🟡 রিকোয়েস্ট চ্যানেল";
  document.getElementById("sReqUrl").value = s.request_channel_url || "";
  document.getElementById("sDirectLinks").value = (s.direct_links || []).join("\n");
  document.getElementById("sForceCh").value = (s.force_channels || []).map(x => typeof x === "string" ? x : x.id).join("\n");

  const vids = await admApi("/api/admin/videos");
  document.getElementById("vidList").innerHTML = vids.map(v => `
    <div class="p-3 rounded-xl bg-black/40 flex flex-wrap justify-between items-center gap-2 text-xs">
      <div><b>${v.title}</b> (${v.parts} Parts • 👁 ${v.views})</div>
      <div class="flex gap-2">
        <button onclick="toggleProt('${v.id}')" class="px-3 py-1 rounded-lg ${v.protect ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">
          ${v.protect ? '🔒 Forward OFF' : '🔓 Forward ON'}
        </button>
        <button onclick="delVid('${v.id}')" class="px-3 py-1 rounded-lg bg-rose-500/20 text-rose-400">🗑 Delete</button>
      </div>
    </div>`).join("");
}

async function saveSettings() {
  await admApi("/api/admin/settings", "POST", {
    app_name: document.getElementById("sAppName").value,
    welcome_notice: document.getElementById("sNotice").value,
    monetag_zone_id: document.getElementById("sMonetag").value.trim(),
    ad_timer: Number(document.getElementById("sTimer").value),
    unlock_expiry_hours: Number(document.getElementById("sExpiry").value),
    vip_coin_price: Number(document.getElementById("sVipPrice").value),
    auto_delete_hours: Number(document.getElementById("sAutoDel").value),
    notification_channel_id: document.getElementById("sNotifCh").value.trim(),
    watch_btn_text: document.getElementById("sWatchTxt").value,
    tutorial_btn_text: document.getElementById("sTutTxt").value,
    tutorial_btn_url: document.getElementById("sTutUrl").value.trim(),
    custom_btn_text: document.getElementById("sCustTxt").value,
    custom_btn_url: document.getElementById("sCustUrl").value.trim(),
    main_channel_name: document.getElementById("sMainName").value,
    main_channel_url: document.getElementById("sMainUrl").value.trim(),
    request_channel_name: document.getElementById("sReqName").value,
    request_channel_url: document.getElementById("sReqUrl").value.trim(),
    direct_links: document.getElementById("sDirectLinks").value.split("\n").map(x => x.trim()).filter(Boolean),
    force_channels: document.getElementById("sForceCh").value.split("\n").map(x => x.trim()).filter(Boolean)
  });
  alert("✅ সেটিংস সেভ হয়েছে!");
}

async function sendBroadcast() {
  await admApi("/api/admin/broadcast", "POST", {
    photo: document.getElementById("bcPhoto").value.trim(),
    text: document.getElementById("bcText").value
  });
  alert("🚀 ব্রডকাস্ট শুরু হয়েছে!");
}

async function toggleProt(id) { await admApi(`/api/admin/video/${id}/protect`, "PATCH"); loadAll(); }
async function delVid(id) { if(confirm("ডিলিট করবেন?")) { await admApi(`/api/admin/video/${id}`, "DELETE"); loadAll(); } }
</script>
</body>
</html>
